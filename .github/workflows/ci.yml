name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 runner for all JavaScript-based actions before the
# 2026-06-02 forced switch. setup-node@v4 is still on the Node 20 runner
# by default — flipping this env makes us forward-compatible today.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security audit (npm)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  rust:
    # Skip on Dependabot PRs: Dependabot only opens PRs for GitHub
    # Actions / dependency version bumps (config-only, no rust diff),
    # so the frontend job still runs and the rust job re-runs on the
    # merge commit to main.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to 1.93 to stop new clippy lints in every Rust release
      # (introduced as `-D warnings` failures) from spuriously breaking
      # CI when the dev environment is on an older stable. Bump
      # deliberately when we want to adopt new lints; mirror the change
      # in release.yml so the build matrix stays in lockstep.
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy, rustfmt

      # Cache cargo registry + git index only — NOT src-tauri/target.
      # Earlier versions of this workflow also cached the build output,
      # keyed solely on Cargo.lock. That surfaced tauri-apps/tauri#13348:
      # tauri-build bakes absolute paths into its generated permission
      # files (under target/debug/build/tauri-*/out/permissions/...),
      # so a cache hit on a target/ populated by a different runner
      # working directory panics with `failed to read plugin permissions
      # ... app_hide.toml: No such file or directory` during the next
      # job's build script. Removing the target/ cache forces a clean
      # tauri-build run on every CI invocation — slower (clippy job
      # ~3-5 min cold vs ~2 min warm) but reliable. The registry + git
      # caches still keep dependency downloads fast.
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Security audit (cargo)
        run: |
          cargo install cargo-audit --locked --quiet || true
          # 4 ignored: quick-xml is only in Tauri's plist/build path; RSA has no
          # patched release and is used only by the explicit SSH client; rkyv is
          # an optional lockfile entry absent from every resolved target graph.
          # Remove an --ignore when its dependency chain gains a fixed release.
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0235
        continue-on-error: true
